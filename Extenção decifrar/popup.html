<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesquisador Rápido</title>
<style>
  :root {
    --bg: #eff2f1; --surface: #ffffff; --fg: #13201e; --muted: #5b6b68; --line: #d8dfdd; --accent: #2b44e8; --accent-fg: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1514; --surface: #172220; --fg: #e8f0ee; --muted: #93a5a1; --line: #263533; --accent: #8c9cff; --accent-fg: #0e1514; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 360px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
  h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  label.cap { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  select, textarea { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .track { position: absolute; inset: 0; background: var(--line); border-radius: 11px; transition: background .15s; }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  #out { min-height: 54px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
  #out.muted { color: var(--muted); }
  #out.err { color: #b3261e; }
  @media (prefers-color-scheme: dark) { #out.err { color: #ff8a80; } }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  a { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .track, .track::after { transition: none; } }
</style>
</head>
<body>
<main>
  <div>
    <h1>Pesquisador Rápido</h1>
    <p class="sub">Selecione texto ou uma imagem para pesquisar, traduzir ou decodificar.</p>
  </div>

  <div class="row">
    <label for="enabled" style="font-weight:600">Ativar painel ao selecionar</label>
    <span class="switch"><input type="checkbox" id="enabled" role="switch" aria-label="Ativar painel ao selecionar"><span class="track"></span></span>
  </div>

  <div>
    <label class="cap" for="target">Traduzir ou converter para</label>
    <select id="target"></select>
  </div>

  <div>
    <label class="cap" for="mode">Como mostrar</label>
    <select id="mode">
      <option value="auto">Automático ao selecionar</option>
      <option value="icon">Mostrar um ícone para clicar</option>
    </select>
  </div>

  <div class="row">
    <label for="autoDecode">Decodificar códigos automaticamente</label>
    <span class="switch"><input type="checkbox" id="autoDecode" role="switch"><span class="track"></span></span>
  </div>
  <div class="row">
    <label for="autoLens">Abrir o Lens ao selecionar imagem</label>
    <span class="switch"><input type="checkbox" id="autoLens" role="switch"><span class="track"></span></span>
  </div>
  <div class="row">
    <label for="rememberPos">Lembrar posição do painel</label>
    <span class="switch"><input type="checkbox" id="rememberPos" role="switch"><span class="track"></span></span>
  </div>
  <div>
    <label class="cap" for="posScope">Onde lembrar a posição</label>
    <select id="posScope">
      <option value="site">Por site</option>
      <option value="global">Em todos os sites</option>
    </select>
  </div>
  <p class="sub">Atalho padrão: Alt+Shift+S. Altere em <a href="chrome://extensions/shortcuts" id="shortcuts" target="_blank" rel="noreferrer">chrome://extensions/shortcuts</a>.</p>

  <hr>

  <div>
    <label class="cap" for="src">Traduzir ou converter um texto</label>
    <textarea id="src" placeholder="Digite ou cole um texto aqui"></textarea>
  </div>
  <div id="out" class="muted" dir="auto" aria-live="polite">O resultado aparece aqui.</div>
  <div class="meta">
    <span id="detected"></span>
    <button type="button" class="btn" id="copy" hidden>Copiar</button>
  </div>
</main>
<script src="langs.js"></script>
<script src="codes.js"></script>
<script src="popup.js"></script>
</body>
</html>
